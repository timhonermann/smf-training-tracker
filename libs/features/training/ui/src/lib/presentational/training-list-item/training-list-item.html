<mat-expansion-panel class="expansion-panel">
  <mat-expansion-panel-header class="header">
    <mat-panel-title class="title">
      <span class="date">{{ item().scheduledAt | date }}</span>
      <span class="details">
        <span class="detail">
          <mat-icon class="detail-icon" svgIcon="location" />
          <span class="detail-text">{{ item().location.name }}</span>
        </span>
        <span class="detail">
          <mat-icon class="detail-icon" svgIcon="group" />
          <span class="detail-text">Participants: {{ item().people.length }}</span>
        </span>
      </span>
    </mat-panel-title>
  </mat-expansion-panel-header>

  <stt-person-list class="person-list" [people]="item().people" />
</mat-expansion-panel>
