<stt-page-layout>
  <stt-back-button pageHeader [link]="backLink()" />
  <stt-page-title
    pageHeader
    title="New Location"
    subtitle="Add a place where trainings take place"
  />

  <stt-tile class="form-tile">
    <mat-form-field class="form-field" appearance="outline">
      <mat-label>Location Name</mat-label>
      <input matInput [formControl]="nameControl" />
    </mat-form-field>
  </stt-tile>

  <stt-button class="create-button" [isDisabled]="!nameControl.valid" (clicked)="create()"
    >Create</stt-button
  >
</stt-page-layout>
