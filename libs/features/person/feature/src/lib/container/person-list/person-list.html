<stt-page-layout>
  <stt-page-title pageHeader title="People" subtitle="All members, decoys and RG leads" />

  <stt-tile class="list-tile">
    <mat-list class="list">
      @for (person of store.entities(); track person.id; let last = $last) {
        <stt-person-list-item [personData]="person" />
        @if (!last) {
          <mat-divider />
        }
      }
    </mat-list>
  </stt-tile>

  <stt-button (clicked)="store.navigateToPersonCreation()"
    >Create Person</stt-button
  >
</stt-page-layout>
