<div class="page">
  <stt-page-title
    title="Dashboard"
    subtitle="Overview of all trainings and requirements"
  />

  <stt-yearly-metric-group
    [yearlyMetric]="store.currentYear()"
    [isCurrentYear]="true"
    (clicked)="store.navigateToTrainingRequirementsCurrentYear()"
  />

  <hr class="divider" />

  <stt-yearly-metric-group
    [yearlyMetric]="store.previousYear()"
    (clicked)="store.navigateToTrainingRequirementsPreviousYear()"
  />
</div>
