<div class="page">
  <stt-page-title
    title="Dashboard"
    subtitle="Overview of all trainings and requirements"
  />

  <stt-yearly-metric-group
    [year]="store.currentYear.year()"
    [totalRequirementReached]="
      store.currentYear.totalPeopleTrainingRequirementReached()
    "
    [totalRequirementAlmostReached]="
      store.currentYear.totalPeopleTrainingRequirementAlmostReached()
    "
    [averageParticipants]="store.currentYear.averageParticipants()"
    [totalTrainings]="store.currentYear.totalTrainings()"
    [isCurrentYear]="true"
    (clicked)="store.navigateToTrainingRequirementsCurrentYear()"
  />

  <hr class="divider" />

  <stt-yearly-metric-group
    [year]="store.previousYear.year()"
    [totalRequirementReached]="
      store.previousYear.totalPeopleTrainingRequirementReached()
    "
    [totalRequirementAlmostReached]="
      store.previousYear.totalPeopleTrainingRequirementAlmostReached()
    "
    [averageParticipants]="store.previousYear.averageParticipants()"
    [totalTrainings]="store.previousYear.totalTrainings()"
    (clicked)="store.navigateToTrainingRequirementsPreviousYear()"
  />
</div>
