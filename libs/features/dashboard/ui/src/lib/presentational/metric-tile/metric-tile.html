<stt-tile class="tile-content">
  <div class="icon-container">
    <mat-icon class="icon" [svgIcon]="icon()" />
  </div>
  <div class="content">
    <div class="header">
      <span class="title">{{ title() }}</span>
      <span class="description">{{ description() }}</span>
    </div>
    <div class="value">
      <span>{{ value() | number: '1.0-1' }}</span>
    </div>
  </div>
