<div
  class="click-target"
  role="button"
  tabindex="0"
  (click)="clicked.emit()"
  (keydown.enter)="clicked.emit()"
>
  <stt-tile class="tile-content" [isClickable]="true">
    <div class="header">
      <div class="accent"></div>
      <div class="heading">
        <span class="title">Training Requirement</span>
        <span class="subtitle"
          >Status of reached and almost reached requirements</span
        >
      </div>
      <div class="detail-link">
        <span>Details</span> <mat-icon fontIcon="chevron_right" />
      </div>
    </div>
    <div class="sub-metric-container">
      <div class="sub-metric reached">
        <span class="badge">
          <mat-icon fontIcon="check" />
        </span>
        <div class="info">
          <strong class="value">{{ totalRequirementReached() }}</strong>
          <span class="label">Reached</span>
        </div>
      </div>
      <div class="sub-metric almost-reached">
        <span class="badge">
          <mat-icon fontIcon="schedule" />
        </span>
        <div class="info">
          <strong class="value">{{ totalRequirementAlmostReached() }}</strong>
          <span class="label">Almost Reached</span>
        </div>
      </div>
    </div>
  </stt-tile>
</div>
