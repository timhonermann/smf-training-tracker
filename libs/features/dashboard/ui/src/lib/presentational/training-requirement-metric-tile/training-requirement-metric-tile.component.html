<a role="button" tabindex="0" (click)="clicked.emit()">
  <stt-tile class="tile-content" [isClickable]="true">
    <div class="header">
      <div class="title">
        <span>Training Requirement</span>
      </div>
      <div class="detail-link">
        <span>Details</span> <mat-icon fontIcon="chevron_right" />
      </div>
    </div>
    <div class="sub-metric-container">
      <div class="sub-metric reached">
        <mat-icon class="icon" fontIcon="check_circle" />
        <div class="info">
          <div class="value">
            <strong>{{ totalRequirementReached() }}</strong>
          </div>
          <span>Reached</span>
        </div>
      </div>
      <div class="sub-metric almost-reached">
        <mat-icon class="icon" fontIcon="pending" />
        <div class="info">
          <div class="value">
            <strong>{{ totalRequirementAlmostReached() }}</strong>
          </div>
          <span>Almost Reached</span>
        </div>
      </div>
    </div>
  </stt-tile>
</a>
