@let metric = yearlyMetric();
<header class="year-heading">
  <div class="title-row">
    <h2 class="year">{{ metric.year }}</h2>
    @if (isCurrentYear()) {
      <span class="current-year-pill">Current Year</span>
    }
  </div>
  <div class="date-range">
    <mat-icon class="calendar-icon" svgIcon="calendar" />
    <span>{{ dateRange() }}</span>
  </div>
</header>
<stt-training-requirement-metric-tile
  [totalRequirementReached]="metric.totalPeopleTrainingRequirementReached"
  [totalRequirementAlmostReached]="
    metric.totalPeopleTrainingRequirementAlmostReached
  "
  (clicked)="clicked.emit()"
/>
<stt-metric-tile
  title="Ø Participants"
  description="Average participants per training"
  [value]="metric.averageParticipants"
  icon="group"
/>
<stt-metric-tile
  title="Total Trainings"
  description="Number of training sessions conducted"
  [value]="metric.totalTrainings"
  icon="paw"
/>
