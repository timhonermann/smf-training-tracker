<header class="year-heading">
  <div class="title-row">
    <h2 class="year">{{ year() }}</h2>
    @if (isCurrentYear()) {
      <span class="current-year-pill">Current Year</span>
    }
  </div>
  <div class="date-range">
    <mat-icon class="calendar-icon" svgIcon="calendar" />
    <span>{{ dateRange() }}</span>
  </div>
</header>
<stt-training-requirement-metric-tile
  [totalRequirementReached]="totalRequirementReached()"
  [totalRequirementAlmostReached]="totalRequirementAlmostReached()"
  (clicked)="clicked.emit()"
/>
<stt-metric-tile
  title="Ø Participants"
  description="Average participants per training"
  [value]="averageParticipants()"
  icon="group"
/>
<stt-metric-tile
  title="Total Trainings"
  description="Number of training sessions conducted"
  [value]="totalTrainings()"
  icon="paw"
/>
